name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: InkEdit-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
